<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Details - TS Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f17; color: #ffffff; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #1f293d; margin-bottom: 30px; }
    .header h1 { font-size: 28px; color: #ffc107; text-transform: capitalize; }
    .back-btn { color: #fff; text-decoration: none; background: #1f293d; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: 0.2s; }
    .back-btn:hover { background: #ffc107; color: #000; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .card { background: #161b26; border: 1px solid #232d3f; border-radius: 12px; padding: 16px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: #ffc107; }
    .card img { width: 100%; height: 160px; object-fit: contain; border-radius: 8px; margin-bottom: 12px; background: #0b0f17; padding: 10px; }
    .card h3 { font-size: 16px; margin-bottom: 6px; color: #ffffff; font-weight: 600; }
    .card .desc { font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }
    .card .price { color: #ffc107; font-size: 18px; font-weight: bold; margin-bottom: 14px; }
    
    .add-btn { background: #ffc107; color: #000000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .add-btn:hover { background: #e0a800; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="catTitle">Category Items</h1>
      <a href="index.html" class="back-btn">← Back to Store</a>
    </div>

    <div class="grid" id="productsGrid"></div>
  </div>

  <script>
    const categoryData = {
      cables: [
        { name: "Type-C Fast Charging Cable", desc: "Fast charging & reliable data transfer", price: 250, image: "images/data%20cables.png" },
        { name: "V8 Micro USB Cable", desc: "Durable cable for charging & data transfer", price: 200, image: "images/data%20cables.png" },
        { name: "USB-C to USB-C Cable", desc: "Fast charging & high-speed data transfer", price: 350, image: "images/data%20cables.png" },
        { name: "Type-C to Lightning Cable", desc: "Fast charging for iPhone & Apple devices", price: 400, image: "images/data%20cables.png" },
        { name: "5 Core Charging Cable", desc: "Strong, durable cable for everyday use", price: 300, image: "images/data%20cables.png" }
      ],
      chargers: [
        { name: "Samsung 25W Fast Charger", desc: "Super fast charging adapter", price: 1200, image: "images/charger.png" },
        { name: "iPhone 20W PD Fast Adapter", desc: "Power delivery fast charger", price: 1500, image: "images/charger.png" }
      ],
      battery: [
        { name: "iPhone 11 High Capacity Battery", desc: "Long-lasting battery backup", price: 2200, image: "images/battery.png" }
      ],
      powerbank: [
        { name: "10,000mAh Slim Power Bank", desc: "Compact & portable power bank", price: 2500, image: "images/power%20bank.webp" }
      ],
      earbuds: [
        { name: "Wireless Earbuds Pro 2", desc: "Crystal clear sound with deep bass", price: 2400, image: "images/earbuds.png" }
      ],
      smartwatch: [
        { name: "Series 9 Smart Watch", desc: "Full touch display & health tracking", price: 3500, image: "images/smart%20watch.webp" }
      ],
      speaker: [
        { name: "Mini Portable Speaker", desc: "Heavy bass wireless bluetooth speaker", price: 1500, image: "images/speaker.webp" }
      ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const cat = urlParams.get('cat') || 'cables';

    document.getElementById('catTitle').innerText = cat + " Collection";

    const grid = document.getElementById('productsGrid');
    const items = categoryData[cat] || [];

    if (items.length === 0) {
      grid.innerHTML = '<p>No items available in this category.</p>';
    } else {
      let html = '';
      items.forEach(item => {
        html += '<div class="card">' +
                  '<div>' +
                    '<img src="' + item.image + '" alt="' + item.name + '">' +
                    '<h3>' + item.name + '</h3>' +
                    '<p class="desc">' + item.desc + '</p>' +
                  '</div>' +
                  '<div>' +
                    '<div class="price">Rs. ' + item.price + '</div>' +
                    '<button class="add-btn">Add to Cart</button>' +
                  '</div>' +
                '</div>';
      });
      grid.innerHTML = html;
    }
  </script>
</body>
</html>
