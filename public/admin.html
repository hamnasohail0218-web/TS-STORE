<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Store — Admin</title>
<style>
  :root{--gold:#D4AF37;--black:#0F0F10;--card:#1E1E20;--line:rgba(255,255,255,0.08);--gray:#9A9A9A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:var(--black);color:#fff;min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:30px 24px;}
  input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:#fff;font-size:13.5px;width:100%;}
  button{background:var(--gold);color:#0F0F10;font-weight:800;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13.5px;}
  button.secondary{background:transparent;border:1px solid var(--line);color:#fff;font-weight:600;}
  button.danger{background:#c0392b;color:#fff;}

  /* Login screen */
  #loginScreen{max-width:360px;margin:100px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;}
  #loginScreen h2{margin-bottom:18px;}
  #loginScreen input{margin-bottom:10px;}
  #loginMsg{color:#ff6b6b;font-size:12.5px;margin-top:8px;}

  /* Dashboard */
  #dashboard{display:none;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .tabs{display:flex;gap:10px;margin-bottom:20px;}
  .tab{padding:9px 16px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:700;}
  .tab.active{border-color:var(--gold);color:var(--gold);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .prod-form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px;}
  .prod-form button{grid-column:1/-1;}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);}
  th{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  tr:last-child td{border-bottom:none;}
  select.status-select{width:auto;}
</style>
</head>
<body>

<div id="loginScreen">
  <h2>Admin Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button id="loginBtn" style="width:100%;">Login</button>
  <div id="loginMsg"></div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="top-bar">
      <h2>TS Store Admin</h2>
      <button class="secondary" id="logoutBtn">Logout</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="products">Products</div>
      <div class="tab" data-tab="orders">Orders</div>
    </div>

    <!-- PRODUCTS TAB -->
    <div class="tab-panel active" id="tab-products">
      <div class="prod-form">
        <input id="pBrand" placeholder="Brand (e.g. Anker)">
        <input id="pName" placeholder="Product name">
        <select id="pCategory">
          <option value="charger">Charger</option>
          <option value="cable">Cable</option>
          <option value="powerbank">Power Bank</option>
          <option value="case">Case</option>
          <option value="earbuds">Earbuds</option>
          <option value="battery">Battery</option>
        </select>
        <input id="pPrice" type="number" placeholder="Price (Rs.)">
        <input id="pOldPrice" type="number" placeholder="Old price (optional)">
        <input id="pImage" placeholder="Image URL (optional)">
        <input id="pBadge" placeholder="Badge e.g. Hot (optional)">
        <select id="pSection">
          <option value="none">No section</option>
          <option value="trending">Trending</option>
          <option value="bestseller">Best Seller</option>
        </select>
        <div></div>
        <button id="addProductBtn">Add Product</button>
      </div>

      <table>
        <thead><tr><th>Brand</th><th>Name</th><th>Category</th><th>Price</th><th>Section</th><th></th></tr></thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>

    <!-- ORDERS TAB -->
    <div class="tab-panel" id="tab-orders">
      <table>
        <thead><tr><th>Customer</th><th>Phone</th><th>City</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API_BASE = ''; // same as index.html — set your backend URL if hosted separately
let token = localStorage.getItem('ts_admin_token') || '';

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadProducts();
  loadOrders();
}

if (token) showDashboard();

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  try {
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.message; return; }
    token = data.token;
    localStorage.setItem('ts_admin_token', token);
    showDashboard();
  } catch (err) {
    msg.textContent = 'Could not reach the server.';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('ts_admin_token');
  location.reload();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
  });
});

function authHeaders() {
  return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
}

async function loadProducts() {
  const res = await fetch(`${API_BASE}/api/products`);
  const products = await res.json();
  document.getElementById('productTableBody').innerHTML = products.map(p => `
    <tr>
      <td>${p.brand}</td><td>${p.name}</td><td>${p.category}</td>
      <td>Rs. ${p.price}</td><td>${p.section}</td>
      <td><button class="danger" data-id="${p._id}" data-action="delete-product">Delete</button></td>
    </tr>
  `).join('');
}

document.getElementById('addProductBtn').addEventListener('click', async () => {
  const body = {
    brand: document.getElementById('pBrand').value.trim(),
    name: document.getElementById('pName').value.trim(),
    category: document.getElementById('pCategory').value,
    price: Number(document.getElementById('pPrice').value),
    oldPrice: document.getElementById('pOldPrice').value ? Number(document.getElementById('pOldPrice').value) : null,
    image: document.getElementById('pImage').value.trim(),
    badge: document.getElementById('pBadge').value.trim(),
    section: document.getElementById('pSection').value,
  };
  if (!body.brand || !body.name || !body.price) { alert('Brand, name and price are required.'); return; }

  const res = await fetch(`${API_BASE}/api/products`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { const d = await res.json(); alert(d.message); return; }
  ['pBrand','pName','pPrice','pOldPrice','pImage','pBadge'].forEach(id => document.getElementById(id).value = '');
  loadProducts();
});

document.getElementById('productTableBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action="delete-product"]');
  if (!btn) return;
  if (!confirm('Delete this product?')) return;
  await fetch(`${API_BASE}/api/products/${btn.dataset.id}`, { method: 'DELETE', headers: authHeaders() });
  loadProducts();
});

async function loadOrders() {
  const res = await fetch(`${API_BASE}/api/orders`, { headers: authHeaders() });
  if (!res.ok) return;
  const orders = await res.json();
  document.getElementById('orderTableBody').innerHTML = orders.map(o => `
    <tr>
      <td>${o.customer.name}</td><td>${o.customer.phone}</td><td>${o.customer.city}</td>
      <td>Rs. ${o.total.toLocaleString()}</td><td>${o.paymentMethod.toUpperCase()}</td>
      <td>
        <select class="status-select" data-id="${o._id}">
          ${['placed','processing','shipped','delivered','cancelled'].map(s =>
            `<option value="${s}" ${o.orderStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>${new Date(o.createdAt).toLocaleDateString()}</td>
    </tr>
  `).join('');
}

document.getElementById('orderTableBody').addEventListener('change', async (e) => {
  const sel = e.target.closest('.status-select');
  if (!sel) return;
  await fetch(`${API_BASE}/api/orders/${sel.dataset.id}`, {
    method: 'PUT', headers: authHeaders(), body: JSON.stringify({ orderStatus: sel.value }),
  });
});
</script>
</body>
</html>
